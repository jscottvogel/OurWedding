version: 1
backend:
  phases:
    build:
      commands:
        # Pin npm to the version that generated package-lock.json; older npm in the build
        # image misreads bundled deps of @aws-amplify/data-construct and fails `npm ci`.
        - npx -y npm@11.6.2 ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # Amplify Hosting only exposes env vars at build time; persist the ones the
        # Next.js server needs at runtime (API routes, middleware).
        - env | grep -E '^(NEXT_PUBLIC_[A-Z_]+|INTERNAL_API_SECRET|SITE_COOKIE_SECRET|SES_FROM_ADDRESS|DEMO_ENABLED|DEMO_USER_EMAIL|DEMO_USER_PASSWORD)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
